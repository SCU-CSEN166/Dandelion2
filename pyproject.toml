[project]
name = "dandelion2"
version = "0.1.0"
description = "Privacy-aware pipeline for transcribing and structuring synthetic and public Dandelion-style field reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "dateparser>=1.4.3",
    "flask>=3.1.3",
    "gliner>=0.2.30",
    "jiwer>=4.0.0",
    "pillow>=13.0.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "transformers>=5.22.1",
    "twilio>=9.12.0",
    "whatstk>=0.10.0",
    "word2number>=1.1",
]

[project.optional-dependencies]
# Choose one extra when syncing. CPU is the portable default for laptops and Mac; GPU avoids
# installing CUDA libraries on machines that cannot use them.
cpu = ["torch>=2.15.0", "torchvision>=0.29.2"]
gpu = ["torch>=2.15.0", "torchvision>=0.29.2"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "gpu" },
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
