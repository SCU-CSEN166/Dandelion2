[project]
name = "dandelion2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "dateparser>=1.4.3",
    "flask>=3.1.3",
    "gliner>=0.2.30",
    "jiwer>=4.0.0",
    "pillow>=13.0.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.22.1",
    "twilio>=9.12.0",
    "whatstk>=0.10.0",
    "word2number>=1.1",
]

# CUDA builds of PyTorch on Windows/Linux (uses an NVIDIA GPU when present; still runs on CPU
# without one). macOS has no CUDA, so it keeps the regular PyPI build.
[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
