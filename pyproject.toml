[project]
name = "dandelion2"
version = "0.1.0"
description = "Privacy-aware pipeline for transcribing and structuring synthetic and public Dandelion-style field reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "dateparser>=1.4.3",
    "flask>=3.1.3",
    "gliner>=0.2.30",
    "jiwer>=4.0.0",
    "pillow>=13.0.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    # Plain PyPI builds so one `uv sync` works everywhere: on Linux (including Colab) this
    # build includes CUDA and also runs on CPU-only machines; on Mac and Windows it is CPU.
    "torch>=2.15.0",
    "torchvision>=0.29.2",  # NuExtract's processor (Qwen2-VL) imports it
    "transformers>=5.22.1",
    "twilio>=9.12.0",
    "whatstk>=0.10.0",
    "word2number>=1.1",
]

# PyPI's Windows build of torch has no CUDA, so Windows gets PyTorch's CUDA build instead.
# Like the Linux build, it uses an NVIDIA GPU when there is one and the CPU otherwise.
[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
